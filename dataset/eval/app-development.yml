- name: "[advanced] A B2B spend-management platform combining corporate charge cards, bill pay, and ..."
  messages:
    - role: user
      content: "Build me this app: A B2B spend-management platform combining corporate charge cards, bill pay, and
        interest-bearing business deposit accounts for growth-stage companies, positioned as offering higher limits and
        more automation than a traditional bank. Every money movement -- card transactions settling, internal transfers,
        bill payments -- is recorded through an internal ledger service using balanced double-entry journal entries
        against per-customer subaccounts, structured as an append-only, event-sourced log so that historical balances
        can always be reconstructed by replay rather than trusted as directly-mutated state. The product exposes an
        accounting/reporting API so customers' finance teams and third-party accounting software can reconcile spend,
        and the backend is built as a fleet of independently deployable microservices communicating via synchronous RPC
        calls and an asynchronous event-streaming bus, with a web dashboard for administrators to manage cards,
        approvals, and payments."
  tags:
    - app-development
    - advanced
    - fintech-ledger
